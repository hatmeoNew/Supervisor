[program:api.wmet.net-laravel-worker-shopify-orders]
process_name=%(program_name)s_%(process_num)02d
command=/www/server/php/81/bin/php /www/wwwroot/api.wmet.net/artisan queue:work rabbitmq --queue=api.wmet.net:orders --sleep=10 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=1
redirect_stderr=true
stdout_logfile=/www/wwwroot/api.wmet.net/worker.log
stopwaitsecs=3600

