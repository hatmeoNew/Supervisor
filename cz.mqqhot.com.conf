[program:laravel-worker-cz.mqqhot.com-odoo-order]
process_name=%(program_name)s_%(process_num)02d
command=/www/server/php/81/bin/php /www/wwwroot/cz.mqqhot.com/artisan queue:work rabbitmq --queue=cz_mqqhot_com:odoo_order --sleep=10 --tries=3 --max-time=3600 --memory=128 --daemon
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=1
redirect_stderr=true
stdout_logfile=/www/wwwroot/cz.mqqhot.com/worker.log
stopwaitsecs=3600
