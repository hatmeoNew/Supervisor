command=/www/server/php/81/bin/php /www/wwwroot/api.sedyes.com/artisan queue:work rabbitmq --queue=api.sedyes.com:shopify-refund --sleep=30 --tries=10 --timeout=3600 --memory=128 --daemon
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=1
redirect_stderr=true
stdout_logfile=/www/wwwroot/api.sedyes.com/worker-shopify-refund.log
stopwaitsecs=3600


