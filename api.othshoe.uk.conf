[program:laravel-worker-api.othshoe.uk-order]
process_name=%(program_name)s_%(process_num)02d
command=php /www/wwwroot/api.othshoe.uk/artisan queue:work rabbitmq --queue=api.othshoe.uk:orders --sleep=10 --tries=3 --max-time=3600 --memory=128 --daemon
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=1
redirect_stderr=true
stdout_logfile=/www/wwwroot/api.othshoe.uk/worker.log
stopwaitsecs=3600

[program:laravel-api.othshoe.uk-refund]
process_name=%(program_name)s_%(process_num)02d
command=php /www/wwwroot/api.othshoe.uk/artisan queue:work rabbitmq --queue=api.othshoe.uk:shopify-refund --sleep=30 --tries=10 --timeout=3600 --memory=128 --daemon
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=1
redirect_stderr=true
stdout_logfile=/www/wwwroot/api.othshoe.uk/worker-shopify-refund.log
stopwaitsecs=3600



