[program:api.hautotool.com-laravel-worker-shopify-orders]
process_name=%(program_name)s_%(process_num)02d
command=/www/server/php/81/bin/php /www/wwwroot/api.hautotool.com/artisan queue:work rabbitmq --queue=api.hautotool.com:orders --sleep=12 --tries=3 --max-time=3600 --daemon
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=1
redirect_stderr=true
stdout_logfile=/www/wwwroot/api.hautotool.com/worker.log
stopwaitsecs=3600

