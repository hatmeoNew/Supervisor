[program:laravel-worker-api.gofrei.de-order]
process_name=%(program_name)s_%(process_num)02d
command=php /www/wwwroot/api.gofrei.de/artisan queue:work rabbitmq --queue=api.gofrei.de:orders --sleep=10 --tries=3 --max-time=3600 --memory=128 --daemon
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=1
redirect_stderr=true
stdout_logfile=/www/wwwroot/api.gofrei.de/worker.log
stopwaitsecs=3600

[program:laravel-api.gofrei.de-refund]
process_name=%(program_name)s_%(process_num)02d
command=php /www/wwwroot/api.gofrei.de/artisan queue:work rabbitmq --queue=api.gofrei.de:shopify-refund --sleep=30 --tries=10 --timeout=3600 --memory=128 --daemon
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=1
redirect_stderr=true
stdout_logfile=/www/wwwroot/api.gofrei.de/worker-shopify-refund.log
stopwaitsecs=3600



