[program:laravel-worker-hu.hatme.net-odoo-order]
process_name=%(program_name)s_%(process_num)02d
command=/www/server/php/81/bin/php /www/wwwroot/hu.hatme.net/artisan queue:work rabbitmq --queue=hu_hatme_net:odoo_order --sleep=10 --tries=3 --max-time=3600 --memory=128 --daemon
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=1
redirect_stderr=true
stdout_logfile=/www/wwwroot/hu.hatme.net/worker.log
stopwaitsecs=3600

