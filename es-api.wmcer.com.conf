
[program:laravel-worker-es-api.wmcer.com-order]
process_name=%(program_name)s_%(process_num)02d
command=php /www/wwwroot/es-api.wmcer.com/artisan queue:work rabbitmq --queue=es-api.wmcer.com:orders --sleep=10 --tries=3 --max-time=3600 --memory=128 --daemon
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=1
redirect_stderr=true
stdout_logfile=/www/wwwroot/es-api.wmcer.com/worker.log
stopwaitsecs=3600

