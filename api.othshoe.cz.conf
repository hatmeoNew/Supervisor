[program:laravel-worker-api.othshoe.cz-order]
process_name=%(program_name)s_%(process_num)02d
command=/www/server/php/81/bin/php /www/wwwroot/api.othshoe.cz/artisan queue:work rabbitmq --queue=api.othshoe.cz:orders --sleep=10 --tries=3 --max-time=3600 --memory=128 --daemon
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=1
redirect_stderr=true
stdout_logfile=/www/wwwroot/api.othshoe.cz/worker.log
stopwaitsecs=3600

