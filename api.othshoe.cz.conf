autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=1
redirect_stderr=true
stdout_logfile=/www/wwwroot/api.othshoe.cz/worker-shopify-refund.log
stopwaitsecs=3600


